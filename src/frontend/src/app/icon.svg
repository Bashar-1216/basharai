<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#112240" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#64ffda" stroke-width="8" stroke-opacity="0.3" />

  <!-- Outer Neural Circuit Nodes -->
  <circle cx="136" cy="136" r="16" fill="#64ffda" filter="url(#glow)" />
  <circle cx="376" cy="136" r="16" fill="#64ffda" filter="url(#glow)" />
  <circle cx="136" cy="376" r="16" fill="#64ffda" filter="url(#glow)" />
  <circle cx="376" cy="376" r="16" fill="#64ffda" filter="url(#glow)" />

  <!-- Connecting Circuit Lines -->
  <path d="M136 136 L256 200 L376 136" fill="none" stroke="#64ffda" stroke-width="8" stroke-opacity="0.4" />
  <path d="M136 376 L256 312 L376 376" fill="none" stroke="#64ffda" stroke-width="8" stroke-opacity="0.4" />

  <!-- Stylized Monogram "B" + AI Brain Chip Core -->
  <path d="M190 140 H280 C325 140, 355 165, 355 205 C355 235, 335 256, 305 262 C342 270, 365 295, 365 332 C365 375, 330 400, 280 400 H190 V140 Z M240 190 V245 H275 C295 245, 310 235, 310 217 C310 200, 295 190, 275 190 H240 Z M240 290 V350 H285 C308 350, 322 338, 322 320 C322 302, 308 290, 285 290 H240 Z" fill="url(#mintGrad)" filter="url(#glow)" />
</svg>
